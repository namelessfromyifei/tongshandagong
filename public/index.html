<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>通山打拱 · 多人联网</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E🀄%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css?v=205">
</head>
<body>
<div id="app">

  <!-- ===== 大厅（进入前） ===== -->
  <div id="lobby">
    <div class="lobbyBox">
      <h1>通山打拱·拱神杨子版</h1>
      <p class="lobbySub" id="lobbyTip">使用微信头像和昵称加入房间</p>
      <!-- 微信授权后的身份 -->
      <div id="wxProfile" class="wxProfile" hidden>
        <img id="wxAvatar" class="wxAvatar" alt="" referrerpolicy="no-referrer">
        <div class="wxMeta">
          <b id="wxName">—</b>
          <span class="wxSub">已获取微信头像和昵称</span>
        </div>
      </div>
      <!-- 手动昵称：未配置微信或用户拒绝授权时使用 -->
      <div class="lobbyRow nameRow" id="nameRow">
        <label>昵称</label>
        <input id="nameInput" type="text" placeholder="我的昵称" maxlength="12">
        <button id="btnSetName" class="btn">设置昵称</button>
        <button id="btnWxLogin" class="btn" hidden>微信授权</button>
      </div>
      <!-- 三个主按钮 -->
      <div class="lobbyRow btns">
        <button id="btnCreate" class="btn gold">创建房间</button>
        <button id="btnJoin" class="btn">加入房间</button>
        <button id="btnRejoin" class="btn">重新连接</button>
      </div>
      <!-- 房间列表 -->
      <div id="roomListWrap" class="roomListWrap">
        <div class="rlTitle">
          <span>已创建的房间</span>
          <button id="btnRefreshList" class="btn small">刷新</button>
        </div>
        <div id="roomList">（连接服务器中…）</div>
      </div>
      <div id="status"></div>
    </div>
  </div>

  <!-- 创建房间弹窗 -->
  <div id="createModal" class="overlay" hidden>
    <div class="modalBox">
      <h2>创建房间</h2>
      <p class="lobbySub">房间号留空则自动生成</p>
      <div class="lobbyRow"><input id="createCode" type="text" placeholder="4 位房间号(可留空)" maxlength="4"></div>
      <div class="mBtn">
        <button id="btnCreateGo" class="btn gold">创建</button>
        <button id="btnCreateBack" class="btn">返回</button>
      </div>
    </div>
  </div>

  <!-- 加入房间弹窗 -->
  <div id="joinModal" class="overlay" hidden>
    <div class="modalBox narrowBox">
      <h2>加入房间</h2>
      <div class="pickBox" id="joinRoomList">
        <div class="lobbySub">等待服务器房间列表…</div>
      </div>
      <div class="lobbyRow"><input id="joinInput" type="text" placeholder="或输入房间号" maxlength="4"></div>
      <div class="mBtn">
        <button id="btnJoinGo" class="btn gold">加入</button>
        <button id="btnJoinBack" class="btn">返回</button>
      </div>
    </div>
  </div>

  <!-- 重连弹窗 -->
  <div id="rejoinModal" class="overlay" hidden>
    <div class="modalBox narrowBox">
      <h2>重新连接</h2>
      <p class="lobbySub" id="rejoinNameHint">将使用昵称：—</p>
      <div class="pickBox" id="rejoinRoomList">
        <div class="lobbySub">等待服务器房间列表…</div>
      </div>
      <div class="lobbyRow"><input id="rejoinCode" type="text" placeholder="或输入房间号" maxlength="4"></div>
      <div class="mBtn">
        <button id="btnRejoinGo" class="btn gold">重连</button>
        <button id="btnRejoinBack" class="btn">返回</button>
      </div>
    </div>
  </div>

  <!-- ===== 牌桌（进入后） ===== -->
  <div id="tableWrap">
    <!-- 轮结算累计显示 -->
    <div id="seriesInfo"></div>
    <div class="table">
      <!-- 牌桌左上角：标题 + 房间号 -->
      <div class="tableTitle">
        <span class="tTitle">通山打拱</span>
        <span class="chip" id="roomCode">房间号：—</span>
      </div>
      <!-- 房间号下方：我是谁 -->
      <div class="chip tableWho" id="mySeatInfo">—</div>
      <!-- 牌桌右上角：局数/模式/配置/退出 -->
      <div class="tableTopRight">
        <div class="topRightInfo">
          <span class="chip" id="lblRound"></span>
          <span class="chip" id="lblMode">2V2</span>
        </div>
        <div class="toolBtns">
          <button id="btnFullscreen" class="btn small toolBtn" style="display:none">退出全屏</button>
          <button id="btnQuick" class="btn small toolBtn">生崽</button>
          <button id="btnVoiceTone" class="btn small toolBtn" style="display:none">音色</button>
        </div>
        <div class="topRightSide">
          <button id="btnLeave" class="btn danger">退出房间</button>
          <button id="btnStart" class="btn gold">对局配置</button>
          <button id="btnRefresh" class="btn">刷新</button>
          <button id="btnVoice" class="btn">语音：开</button>
        </div>
      </div>
      <!-- 牌桌左上角（标题下方）：叫牌 + 明鸡状态 -->
      <div class="corner" id="corner"></div>
      <!-- 视角座位：0=南(我) 1=东(下家) 2=北(对家) 3=西 -->
      <div class="seat seatN" data-seat="2">
        <div class="head">
          <div class="avatar" id="av2">北</div>
          <div class="nm" id="nm2">北家</div>
          <div class="tag" id="tag2"></div>
        </div>
        <div class="cards back" id="h2"></div>
        <div class="pts" id="p2"></div>
        <div class="seatHint" id="hint2"></div>
      </div>
      <div class="seat seatW" data-seat="3">
        <div class="head">
          <div class="avatar" id="av3">西</div>
          <div class="nm" id="nm3">西家</div>
          <div class="tag" id="tag3"></div>
        </div>
        <div class="cards back" id="h3"></div>
        <div class="pts" id="p3"></div>
        <div class="seatHint" id="hint3"></div>
      </div>
      <div class="center">
        <div id="msg">等待开始…</div>
        <div id="trickScore"></div>
      </div>
      <div class="seat seatE" data-seat="1">
        <div class="head">
          <div class="avatar" id="av1">东</div>
          <div class="nm" id="nm1">东家</div>
          <div class="tag" id="tag1"></div>
        </div>
        <div class="cards back" id="h1"></div>
        <div class="pts" id="p1"></div>
        <div class="seatHint" id="hint1"></div>
      </div>
      <div class="trick trickN" id="t2"></div>
      <div class="trick trickW" id="t3"></div>
      <div class="trick trickE" id="t1"></div>
      <!-- 玩家手牌区 -->
      <div class="south">
        <div class="southMain">
          <div class="actions">
            <button id="btnHe" class="btn danger">毁牌（重发）</button>
            <button id="btnNext" class="btn gold" style="display:none">下一局</button>
          </div>
          <!-- 手牌行：信息框（左）、手牌（中）、排序按钮（右）；左右两列等宽以保证手牌居中 -->
          <div class="handRow">
            <div class="seat seatS" data-seat="0">
              <div class="head">
                <div class="avatar" id="av0">南</div>
                <div class="nm" id="nm0">你</div>
                <div class="tag" id="tag0"></div>
              </div>
              <div class="pts" id="p0"></div>
              <div class="southHint" id="hint0"></div>
            </div>
            <div class="handArea"><div id="hand"></div></div>
            <!-- 出牌/提示/不要：牌的右上角；明独/不明独：牌的中间（初始轮用） -->
            <div class="playBtns" id="playBtns">
              <button id="btnPlay" class="btn gold" disabled>出牌</button>
              <button id="btnHint" class="btn">提示</button>
              <button id="btnPass" class="btn" disabled>不要</button>
              <button id="btnReady" class="btn gold" style="display:none">准备</button>
            </div>
            <div class="midBtns" id="midBtns">
              <button id="btnHard" class="btn danger">明独</button>
            </div>
          </div>
        </div>
      </div>
      <div class="trick trickS" id="t0"></div>
      <!-- 排序 / 牌大小：固定在牌桌右下角，高层级；发牌后才显示 -->
      <div class="tableSideBtns">
        <button id="btnSort" class="btn tableSideBtn" style="display:none">排序</button>
        <button id="btnSize" class="btn tableSideBtn" style="display:none">牌大小</button>
      </div>

      <!-- 牌局设置弹窗（须在 #app 内，才能随 app 一起横屏旋转） -->
      <div id="setModal" class="overlay" hidden>
        <div class="modalBox">
          <h2>牌局设置</h2>
          <div class="setGrid">
            <label>一场局数 <select id="setRounds"><option value="1">1</option><option value="3" selected>3</option><option value="5">5</option><option value="10">10</option></select></label>
            <label>王总数 <select id="setKings"><option value="8">8</option><option value="10">10</option><option value="12">12</option></select></label>
            <label>王单出 <select id="setJoker"><option value="3">算3</option><option value="2">算2</option></select></label>
            <label>半边分数 <input id="setHalfFan" type="number" min="1" max="50" step="1" value="1" style="width:56px"></label>
            <label>笼数封顶 <select id="setFanCap"><option value="32">32</option><option value="64">64</option><option value="128">128</option><option value="0">不封顶</option></select></label>
            <label class="chk"><input type="checkbox" id="setTailBonus"> 尾游也可拿王奖金</label>
            <label class="chk"><input type="checkbox" id="setShowRemain"> 显示剩余张数</label>
            <label class="chk"><input type="checkbox" id="setShowCorner"> 显示牌局信息框（左上角）</label>
            <label class="chk"><input type="checkbox" id="setShowLog"> 显示出牌记录框（右上角）</label>
            <label class="chk"><input type="checkbox" id="setAIFill"> AI 补位（不足4人时）</label>
          </div>
          <div class="mBtn">
            <button id="btnSetGo" class="btn gold">开始对局</button>
            <button id="btnSetBack" class="btn">返回</button>
          </div>
        </div>
      </div>

      <!-- 本局结算弹窗（须在 #app 内，才能随 app 一起横屏旋转） -->
      <div id="modal" class="overlay" hidden>
        <div class="modalBox">
          <h2 id="mTitle">本局结果</h2>
          <button id="btnPeek" class="btn small">关闭计分板</button>
          <table id="mTable"></table>
          <div class="mBtn"><button id="btnClose" class="btn gold">下一局</button></div>
        </div>
      </div>

    </div>

    <div class="log" id="log"></div>
  </div>
</div>

<script src="vendor/socket.io.min.js?v=205"></script>
<script src="js/engine.js?v=205"></script>
<script src="js/ai.js?v=205"></script>
<script src="js/ui-net.js?v=205"></script>
<script src="js/screen.js?v=205"></script>
<script src="js/app.js?v=205"></script>
<script src="js/env.js?v=205"></script>
<script src="js/net.js?v=205"></script>
</body>
</html>
