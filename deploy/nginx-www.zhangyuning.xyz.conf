# 通山打拱 · www.zhangyuning.xyz
# Ubuntu 22.04 / Nginx 1.18
# 放置到 /etc/nginx/sites-available/tongshandagong 后：
#   sudo ln -sf /etc/nginx/sites-available/tongshandagong /etc/nginx/sites-enabled/tongshandagong
#   sudo nginx -t && sudo systemctl reload nginx
#
# 注意：map 必须放在 http 上下文（server 块外）；sites-enabled 文件位于 http 上下文中，可以直接放。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name www.zhangyuning.xyz;
    return 301 https://$host$request_uri;
}

# ---- 备案完成前的 IP 直连（内测用，正式上线后建议删掉）----
# App 用 http://8.148.29.231 访问；按 IP 直接代理到 Node，不做 HTTPS 跳转。
# 域名请求仍走上面的 301，不受影响。服务器 IP 变了要同步改这里的 server_name。
server {
    listen 80;
    server_name 8.148.29.231;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Socket.IO WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl http2;
    server_name www.zhangyuning.xyz;

    # 换成你实际上传的证书文件名
    ssl_certificate     /etc/nginx/ssl/www.zhangyuning.xyz.pem;
    ssl_certificate_key /etc/nginx/ssl/www.zhangyuning.xyz.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 让服务端知道外部是 HTTPS（微信登录 Cookie 需要 Secure）
        proxy_set_header X-Forwarded-Proto $scheme;

        # Socket.IO WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}
